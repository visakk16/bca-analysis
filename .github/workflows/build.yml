name: Build Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
          
      - name: Build executable
        run: pyinstaller --onedir --name BCA-Plate-Analysis --collect-all streamlit --collect-all pandas --collect-all numpy --collect-all matplotlib --collect-all openpyxl --collect-all pyarrow --collect-all reportlab --hidden-import pyarrow --add-data "bca_app.py;." desktop.py
      
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: BCA-Plate-Analysis-Windows
          path: dist/
